name: Daily IELTSATION post

on:
  schedule:
    # The posting time is set in config.json ("post_time", Tashkent time) - NOT here.
    # GitHub starts scheduled runs hours late, so several runs are started during
    # the day. The first one that begins within about 5 hours of post_time prepares
    # the post, waits, and publishes exactly on time; the others see it and quit.
    # Times below are UTC (Tashkent 09:07, 11:07, 13:07, 15:07, 17:07, 18:37, 19:37).
    - cron: "7 4,6,8,10,12 * * *"
    - cron: "37 13,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (prints the post in the log, does not publish)"
        type: boolean
        default: false
      day:
        description: "Preview another weekday (e.g. monday). Leave empty for today"
        type: string
        default: ""
      force:
        description: "Publish even if a post already went out today"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Generate and publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: >
          python3 bot.py
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ github.event_name == 'schedule' && '--wait' || '' }}
          ${{ inputs.force && '--force' || '' }}
          ${{ inputs.day && format('--day {0}', inputs.day) || '' }}

      - name: Remember what was posted
        run: |
          git config user.name "ieltsation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Posted $(date -u +%F)" && git push)
